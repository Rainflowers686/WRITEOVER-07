name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: Also run all retained routes and scenario matrices
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure Debug
        run: cmake --preset ci
      - name: Build Debug application
        run: cmake --build --preset ci --target writeover_app
      - name: Configure Release
        run: cmake --preset release
      - name: Build Release
        run: cmake --build --preset release
      - name: FAST_REQUIRED
        shell: pwsh
        run: ./scripts/run_qa.ps1 -Tier FAST_REQUIRED -EvidenceDirectory docs/production/evidence/qa-fast
      - name: EXTENDED
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended }}
        shell: pwsh
        run: ./scripts/run_qa.ps1 -Tier EXTENDED -EvidenceDirectory docs/production/evidence/qa-extended
      - name: Preserve QA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-qa-receipts
          path: docs/production/evidence/qa-*/**/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve machine-readable QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-qa-results
          path: docs/production/evidence/qa-*/**/*.json
          if-no-files-found: warn
          retention-days: 14

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deterministic content and schema
        run: |
          python tools/contentc/contentc.py --data-dir data --out-dir data --check
          python tools/systemic/systemic_schema_check.py --data-dir data
          python scripts/check_localization.py
      - name: Configure Linux GCC
        run: cmake --preset linux-debug
      - name: Build Linux GCC
        run: cmake --build --preset linux-debug --parallel 2
      - name: Linux unit and public-header tests
        run: ctest --preset linux-debug --output-on-failure
      - name: Linux smoke
        run: ./out/build/linux-debug/writeover_app --smoke --data-dir data --frames 61 --width 80 --height 30
      - name: Configure Linux Release benchmark
        run: cmake --preset linux-release
      - name: Build benchmark target only
        run: cmake --build --preset linux-release --target writeover_bench --parallel 2
      - name: Linux Release benchmark gate
        run: ./out/build/linux-release/writeover_bench

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure macOS arm64
        run: cmake --preset macos-arm64
      - name: Build macOS arm64
        run: cmake --build --preset macos-arm64 --parallel 2
      - name: macOS unit and public-header tests
        run: ctest --preset macos-arm64 --output-on-failure
      - name: macOS smoke
        run: ./out/build/macos-arm64/writeover_app --smoke --data-dir data --frames 61 --width 80 --height 30
      - name: Configure macOS Release benchmark
        run: cmake --preset macos-arm64-release
      - name: Build benchmark target only
        run: cmake --build --preset macos-arm64-release --target writeover_bench --parallel 2
      - name: macOS Release benchmark gate
        run: ./out/build/macos-arm64-release/writeover_bench

  linux-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure Linux Clang
        run: cmake --preset linux-clang
      - name: Build application and tests
        run: cmake --build --preset linux-clang --target writeover_app writeover_tests writeover_public_header_check --parallel 2
      - name: Clang unit and public-header tests
        run: ctest --preset linux-clang --output-on-failure
      - name: Clang smoke
        run: ./out/build/linux-clang/writeover_app --smoke --data-dir data --frames 61 --width 80 --height 30

  linux-arm64-link:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu
      - name: Configure ARM64 link gate
        run: cmake --preset linux-arm64-link
      - name: Build ARM64 link gate
        run: cmake --build --preset linux-arm64-link --parallel 2
      - name: Confirm ARM64 ELF (not hardware execution)
        run: |
          file out/build/linux-arm64-link/writeover_app | tee arm64-elf.txt
          grep -q "ARM aarch64" arm64-elf.txt
