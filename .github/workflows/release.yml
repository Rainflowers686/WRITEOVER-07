name: Release Player Packages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing immutable version tag (must match PRODUCT_VERSION)
        required: true
        type: string
      publish:
        description: Publish a NEW pre-release after all package checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve and verify immutable release metadata
        id: metadata
        env:
          WRITEOVER_RELEASE_TAG: ${{ inputs.source_ref }}
        run: python tools/release/release_metadata.py --require-tag --platform ${{ matrix.platform }} --github-output-env
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts/package_windows.ps1
      - name: Package Linux
        if: runner.os == 'Linux'
        run: bash scripts/package_linux.sh
      - name: Package macOS
        if: runner.os == 'macOS'
        run: bash scripts/package_macos.sh
      - name: Verify clean package
        run: python tools/release/package_smoke.py --platform ${{ matrix.platform }} --archive dist/${{ steps.metadata.outputs.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: writeover-${{ matrix.platform }}
          path: dist/${{ steps.metadata.outputs.archive }}
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve and verify immutable release metadata
        id: metadata
        env:
          WRITEOVER_RELEASE_TAG: ${{ inputs.source_ref }}
        run: python tools/release/release_metadata.py --require-tag --github-output-env
      - uses: actions/download-artifact@v4
        with:
          pattern: writeover-*
          merge-multiple: true
          path: dist
      - name: Publish new candidate without modifying old releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.title }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
          WINDOWS_ARCHIVE: ${{ steps.metadata.outputs.windows_archive }}
          LINUX_ARCHIVE: ${{ steps.metadata.outputs.linux_archive }}
          MACOS_ARCHIVE: ${{ steps.metadata.outputs.macos_archive }}
        run: |
          set -euo pipefail
          test -f docs/release/PLAYER_GUIDE.zh-CN.md
          test -f docs/release/PLAYER_GUIDE.en.md
          test -f "$RELEASE_NOTES"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
          (cd dist && sha256sum "$WINDOWS_ARCHIVE" "$LINUX_ARCHIVE" "$MACOS_ARCHIVE" > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --prerelease \
            "dist/$WINDOWS_ARCHIVE" "dist/$LINUX_ARCHIVE" "dist/$MACOS_ARCHIVE" \
            dist/SHA256SUMS.txt docs/release/PLAYER_GUIDE.zh-CN.md \
            docs/release/PLAYER_GUIDE.en.md "$RELEASE_NOTES"
